{% extends 'schedulr/layout.html' %}

{% block body %}

    <button class="btn btn-primary"><a href="{ url 'add_employee' }"></a></button>

    {% for employee in employees %}

        <h4>{{ employee.name }}</h4>
        <h4>{{ employee.position }}</h4>
        <h3>{{  employee.hourly_rate  }}</h3>
        <span>{{ employee.hire_date }}</span>

    {% endfor %}

{% endblock %}
