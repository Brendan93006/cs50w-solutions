{% extends 'layout.html' %}

{% block body %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Employees</h2>
        <a href="{% url 'add_employee' %}" class="btn btn-primary">
            + Add Employee
        </a>
    </div>

    {% if message %}
        <div class="alert alert-info mb-0">
            {{ message }}
        </div>
    {% else %}

        <div class="row g-4">

            {% for employee in employees %}
                <div class="col-md-6 col-lg-4">

                    <div class="card shadow-sm h-100 rounded-4 border border-2">
                        <div class="card-body p-3">

                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div class="me-2">
                                    <h5 class="card-title mb-0">
                                        {{ employee.name }}
                                    </h5>
                                    <small class="text-muted">
                                        {{ employee.position }}
                                    </small>
                                </div>

                                <button class="delete-employee-btn btn btn-sm btn-outline-danger rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
                                        data-employee-id="{{ employee.id }}"
                                        title="Delete {{ employee.name }}"
                                        style="width: 34px; height: 34px;">
                                    <i class="bi bi-trash fs-6"></i>
                                </button>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <div>
                                    <div class="fw-semibold">${{ employee.hourly_rate }}/hr</div>
                                    <small class="text-secondary">Hired: {{ employee.hire_date }}</small>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            {% endfor %}

        </div>

    {% endif %}

</div>

{% endblock %}
