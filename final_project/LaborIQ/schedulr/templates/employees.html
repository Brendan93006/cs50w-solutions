{% extends 'layout.html' %}

{% block body %}

    <div>
        <a href="{% url 'add_employee' %}"><button class="btn btn-primary">+ Add Employee</button></a>
    </div>

{% if message %}

    {{ message }}

{% else %}

    {% for employee in employees %}

        <h4>{{ employee.name }}</h4>
        <h4>{{ employee.position }}</h4>
        <h3>{{  employee.hourly_rate  }}</h3>
        <span>{{ employee.hire_date }}</span>

    {% endfor %}

{% endif %}

{% endblock %}
